baseURL: https://blog.charliie.dev
locale: en-us
title: charliie.dev
enableRobotsTXT: true

# Hextra as a Hugo module; the version is pinned in go.mod too (Renovate updates both).
module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra
      version: v0.13.0

services:
  googleAnalytics:
    id: G-0YYDW2B6FM

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true # Logseq exports carry raw HTML
    extensions:
      # Math for KaTeX. Inline math uses \( \) only, so dollar signs in prose stay literal.
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true

enableInlineShortcodes: true

# Categories are folded into tags; tags are the only taxonomy.
taxonomies:
  tag: tags

outputs:
  home: [html, rss]
  section: [html, rss]
  page: [html, markdown]

menu:
  main:
    - name: Blog
      pageRef: /page
      weight: 1
    - name: Disc Jockey
      pageRef: /dj
      weight: 2
    - name: Foodie
      pageRef: /foodie
      weight: 3
    - name: Tags
      pageRef: /tags
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/charliie-dev
      weight: 6
      params:
        icon: github
    - name: Email
      url: mailto:mail@charliie.dev
      weight: 7
      params:
        icon: mail
    - name: RSS
      url: /index.xml
      weight: 8
      params:
        icon: rss

params:
  description: HipHop enthusiast, PKM learner and Coffee addict.

  page:
    width: normal
    contextMenu:
      enable: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/unicorn_logo_black.svg
      dark: images/unicorn_logo_white.svg
      width: 31
      height: 30
      link: /

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    default: system
    displayToggle: true

  highlight:
    copy:
      enable: true
      display: hover

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch

  imageZoom:
    enable: true

  externalLinkDecoration: true

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
    article:
      displayPagination: true
